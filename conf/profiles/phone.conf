# phone profile
# Install: bash install.sh --profile phone
#
# Termux on Android. Same feature set as the other machines (TPM plugins on,
# full scrollback). Shows "phone" in the status bar instead of the Termux
# hostname "localhost". tm-clip falls back to the tmux buffer here unless
# termux-api is installed.

set -g @machine_color 'cyan'
set -g @machine_label 'phone'
