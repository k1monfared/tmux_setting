# =============================================================================
# tmux configuration
# Prefix: Ctrl+T
# =============================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# --- Session Management ---
bind r command-prompt -I "#S" "rename-session '%%'"
bind d detach-client

# --- Pane Splitting ---
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane Navigation (no prefix) ---
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# --- Pane Resizing (no prefix, Alt+arrows) ---
bind -n M-Left resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up resize-pane -U 2
bind -n M-Down resize-pane -D 2

# --- Window Management ---
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind n next-window
bind p previous-window

# --- Pane Management ---
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind z resize-pane -Z
bind Space next-layout

# --- Copy Mode ---
# Background on why selection works this way (and what we tried), see
# mouse-selection.log at the repo root.
bind [ copy-mode
# For everyday "select text like a normal terminal" (highlight stays, no scroll
# jump, click to deselect): hold SHIFT while dragging. Shift bypasses tmux mouse
# capture so mate-terminal does its own native selection. Enable "copy on select"
# in mate-terminal, or use Ctrl+Shift+C, to put it on the clipboard.
#
# tmux copy-mode below is the keyboard workflow (prefix [ to enter, then move and
# select). Enter / M-w copy the selection to the system clipboard via xclip.
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode    M-w   send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi M-w   send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Reading mode: use a selection as a visual bookmark while reading scrollback.
#
# Drag selects a bookmark and does NOT copy. begin-selection runs during the drag
# (from the root MouseDrag binding); on release stop-selection freezes it so it
# stays highlighted and scrolling no longer grows it. Nothing is written to the
# clipboard. To copy on purpose, use Enter / M-w, or Shift+drag for native copy.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Single click just clears the highlight and stays put. Every click behaves the
# same: cursor goes to the click, the selection is cleared, and the view does not
# move. It does NOT leave copy mode, because a real exit always snaps back to the
# live prompt at the bottom (the jump we are avoiding). To return to the prompt,
# press q or wheel down to the bottom. A drag ends in MouseDragEnd, not MouseUp, so
# bookmarking never triggers this.
bind -T copy-mode    MouseUp1Pane send-keys -X clear-selection
bind -T copy-mode-vi MouseUp1Pane send-keys -X clear-selection

# Double / triple click copy the word / line to the clipboard and stay put. Using
# copy-pipe (not copy-pipe-and-cancel) means no exit and no jump to the bottom.
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -selection clipboard -in"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -selection clipboard -in"
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -selection clipboard -in"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe "xclip -selection clipboard -in"

# --- Mouse Scroll ---
# Mouse wheel / touchpad scroll enters copy mode and scrolls history
# instead of cycling through shell commands. Note: plain "copy-mode" (no -e) so
# scrolling to the very bottom does NOT auto-exit copy mode. The -e auto-exit was
# destroying the reading bookmark the instant the bottom was reached.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# --- Help ---
bind ? list-keys

# --- Sensible Defaults ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g focus-events on
set -g set-clipboard on

# --- Status Bar ---
set -g status-position bottom
set -g status-style "bg=default,fg=#808080"
# machine identity: host name colored per machine (k76 green, khome magenta, else yellow)
set -g status-left "#{?#{==:#H,khome},#[fg=magenta bold] khome ,#{?#{==:#H,k76},#[fg=green bold] k76 ,#{?#{==:#H,k1},#[fg=green bold] k76 ,#[fg=yellow bold] #H }}}#[fg=#404040]│#[fg=#c0c0c0,bold] #S #[fg=#404040]│ "
set -g status-left-length 40
set -g status-right "#[fg=#606060] %H:%M "
set -g status-right-length 20

# Window status
setw -g window-status-format "#[fg=#606060] #I:#W #[fg=#4d4d4d]#{b:pane_current_path}#{@remote_label} "
setw -g window-status-current-format "#[fg=#ffffff,bold] #I:#W #[fg=#8a8a8a]#{b:pane_current_path}#{@remote_label} "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#404040"
set -g pane-active-border-style "fg=#808080"

# Message styling
set -g message-style "fg=#ffffff,bg=#333333"

# =============================================================================
# Plugins (TPM - Tmux Plugin Manager)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: also save/restore pane scrollback contents
set -g @resurrect-capture-pane-contents 'on'

# Resurrect: relaunch these on restore, in each pane's saved folder.
#   ssh    -> reconnects to the saved host (e.g. "ssh khome")
#   claude -> "claude --continue" resumes that folder's most-recent conversation
# Note: two claude panes in the SAME folder both resume that folder's newest one.
set -g @resurrect-processes 'ssh "~claude->claude --continue"'

# Continuum: auto-save every 5 min + auto-restore on a fresh server start (e.g.
# after reboot). Boot service stays OFF (its ExecStop runs kill-server); the login
# picker starts tmux and restore fires then. Manual restore: Ctrl+T Ctrl+R
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot 'off'

# Initialize TPM (KEEP THIS LINE LAST)
run '~/.tmux/plugins/tpm/tpm'
